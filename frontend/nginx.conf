server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # /api quita el prefijo (trailing slash en proxy_pass) porque el backend
    # monta sus rutas en la raíz (/auth/*, /gestiones, ...).
    #
    # MODO EXTERNO (actual): la API vive en Render/Cloudflare. El Host y el
    # SNI ($proxy_ssl_server_name on) son OBLIGATORIOS: sin SNI, Cloudflare
    # responde handshake_failure (SSL alert 40) y Nginx devuelve 502.
    # MODO LOCAL (producción): cambia estas dos líneas por
    #   proxy_pass http://backend:8000/;
    # y elimina las directivas proxy_ssl_* y el Host manual.
    location /api/ {
        proxy_pass https://reactivacion-proyect.onrender.com/;

        proxy_ssl_server_name on;
        proxy_ssl_name reactivacion-proyect.onrender.com;
        proxy_set_header Host reactivacion-proyect.onrender.com;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}